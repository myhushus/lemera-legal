name: Check Lemera Legal Site

on:
  pull_request:
    paths:
      - 'public/**'
      - 'tests/**'
      - '.github/workflows/legal-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run legal site tests
        run: node --test tests/*.test.cjs
