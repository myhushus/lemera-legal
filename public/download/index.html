<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Get Lemera</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Download Lemera for your device.">
  <link rel="stylesheet" href="/assets/legal.css">
  <style>
    .download-wrap{max-width:560px;margin:72px auto 0;text-align:center}
    .download-mark{width:72px;height:72px;margin:0 auto 18px;border-radius:18px;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;font-size:2rem}
    .download-sub{margin:0 auto 28px;max-width:430px;color:var(--muted)}
    .store-list{display:grid;gap:12px;margin:28px auto 18px;max-width:420px}
    .store-link{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:64px;padding:14px 18px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--fg);text-decoration:none;text-align:left}
    .store-link strong{display:block;font-size:1rem}
    .store-link span{display:block;color:var(--muted);font-size:.88rem}
    .store-link[data-recommended="true"]{border-width:2px;border-color:var(--link)}
    .store-link[aria-disabled="true"]{opacity:.6;cursor:default}
    .store-badge{font-size:.78rem;color:var(--muted);white-space:nowrap}
    .platform-note{min-height:1.5em;color:var(--muted);font-size:.9rem;margin-top:18px}
    .download-foot{margin-top:44px}
  </style>
</head>
<body>
<main>
  <nav><a href="/">Lemera Legal</a><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a><a href="/licenses/">Licenses</a></nav>

  <section class="download-wrap" aria-labelledby="download-title">
    <div class="download-mark" aria-hidden="true">📷</div>
    <h1 id="download-title">Get Lemera</h1>
    <p id="download-subtitle" class="download-sub">Choose the store for your device.</p>

    <div class="store-list" aria-label="Download options">
      <a id="play-store-link" class="store-link" href="#" rel="noopener noreferrer">
        <span>
          <strong id="play-title">Google Play</strong>
          <span id="play-caption">For Android devices</span>
        </span>
        <span id="play-badge" class="store-badge">Open</span>
      </a>

      <a id="app-store-link" class="store-link" href="#" rel="noopener noreferrer" aria-disabled="true">
        <span>
          <strong id="app-title">App Store</strong>
          <span id="app-caption">For iPhone and iPad</span>
        </span>
        <span id="app-badge" class="store-badge">Coming Soon</span>
      </a>
    </div>

    <p id="platform-note" class="platform-note" aria-live="polite"></p>

    <footer class="download-foot">
      <p><a href="/privacy/">Privacy Policy</a> · <a href="/terms/">Terms of Service</a> · <a href="/licenses/">Open Source Licenses</a></p>
    </footer>
  </section>
</main>
<script src="/download/config.js"></script>
<script src="/download/download.js"></script>
</body>
</html>
