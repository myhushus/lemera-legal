<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Lemera Legal</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/assets/legal.css">
<style>main{overflow-wrap:anywhere}#language{font:inherit;min-height:44px;max-width:100%;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--fg);padding:6px 12px}</style></head>
<body><main>
<nav><a id="nav-home" href="/">Lemera Legal</a><a id="nav-privacy" href="/privacy/">Privacy</a><a id="nav-terms" href="/terms/">Terms</a><a id="nav-licenses" href="/licenses/">Licenses</a><select id="language" aria-label="Language / 언어 / Idioma / Langue"><option value="en">English</option><option value="ko">한국어</option><option value="es">Español</option><option value="fr">Français</option><option value="pt">Português</option><option value="de">Deutsch</option><option value="id">Bahasa Indonesia</option><option value="ja">日本語</option></select></nav>
<h1 id="title">Lemera Legal</h1><p class="meta" id="intro">Legal pages for Lemera by Meroviq.</p>
<ul><li><a id="privacy" href="/privacy/en/v1.4/en.html">Privacy Policy</a></li><li><a id="terms" href="/terms/en/v1.2/">Terms of Service</a></li><li><a id="licenses" href="/licenses/?lang=en">Open Source Licenses</a></li></ul>
<footer><p><span id="contact">Contact</span>: <a href="mailto:lemera@meroviq.com">lemera@meroviq.com</a></p></footer>
</main>
<script>
(function(){
  const copy={
    en:{brand:'Lemera Legal',privacy:'Privacy',terms:'Terms',licenses:'Licenses',policy:'Privacy Policy',service:'Terms of Service',notice:'Open Source Licenses',intro:'Legal pages for Lemera by Meroviq.',contact:'Contact',links:['/privacy/en/v1.4/en.html','/terms/en/v1.2/','/licenses/?lang=en']},
    ko:{brand:'공카 정보',privacy:'개인정보처리방침',terms:'이용약관',licenses:'라이선스',policy:'개인정보처리방침',service:'이용약관',notice:'오픈소스 라이선스',intro:'Meroviq 공카의 법률 문서입니다.',contact:'문의',links:['/privacy/ko/v1.4/ko.html','/terms/ko/v1.2/','/licenses/?lang=ko']},
    ja: {"brand": "Lemeraの情報", "privacy": "プライバシー", "terms": "規約", "licenses": "ライセンス", "policy": "プライバシーポリシー", "service": "利用規約", "notice": "オープンソースライセンス", "intro": "Meroviqが提供するLemeraの法的文書です。", "contact": "お問い合わせ", "links": ["/privacy/ja/v1.4/ja.html", "/terms/ja/v1.2/", "/licenses/ja/"]},
    id: {"brand": "Informasi Lemera", "privacy": "Privasi", "terms": "Ketentuan", "licenses": "Lisensi", "policy": "Kebijakan Privasi", "service": "Ketentuan Layanan", "notice": "Lisensi sumber terbuka", "intro": "Dokumen hukum Lemera dari Meroviq.", "contact": "Kontak", "links": ["/privacy/id/v1.4/id.html", "/terms/id/v1.2/", "/licenses/id/"]},
    de: {"brand": "Lemera-Informationen", "privacy": "Datenschutz", "terms": "Bedingungen", "licenses": "Lizenzen", "policy": "Datenschutzerklärung", "service": "Nutzungsbedingungen", "notice": "Open-Source-Lizenzen", "intro": "Rechtliche Dokumente für Lemera von Meroviq.", "contact": "Kontakt", "links": ["/privacy/de/v1.4/de.html", "/terms/de/v1.2/", "/licenses/de/"]},
    pt: {"brand": "Informações do Lemera", "privacy": "Privacidade", "terms": "Termos", "licenses": "Licenças", "policy": "Política de Privacidade", "service": "Termos de Serviço", "notice": "Licenças de código aberto", "intro": "Documentos legais do Lemera, da Meroviq.", "contact": "Contato", "links": ["/privacy/pt/v1.4/pt.html", "/terms/pt/v1.2/", "/licenses/pt/"]},
    fr:{"brand": "Informations de Lemera", "privacy": "Confidentialité", "terms": "Conditions", "licenses": "Licences", "policy": "Politique de confidentialité", "service": "Conditions d’utilisation", "notice": "Licences open source", "intro": "Documents juridiques de Lemera, proposée par Meroviq.", "contact": "Contact", "links": ["/privacy/fr/v1.4/fr.html", "/terms/fr/v1.2/", "/licenses/fr/"]},
    es:{brand:'Información de Lemera',privacy:'Privacidad',terms:'Términos',licenses:'Licencias',policy:'Política de privacidad',service:'Términos del servicio',notice:'Licencias de código abierto',intro:'Documentos legales de Lemera, de Meroviq.',contact:'Contacto',links:['/privacy/es/v1.4/es.html','/terms/es/v1.2/','/licenses/releases/android-1.1.0-13/es/']}
  };
  const pick=value=>{const code=String(value||'en').toLowerCase().split(/[-_]/)[0];return copy[code]?code:'en';};
  const selector=document.getElementById('language');
  function render(locale){
    const code=pick(locale),t=copy[code];
    document.documentElement.lang=code;document.title=t.brand;
    for(const [id,key] of Object.entries({'nav-home':'brand','nav-privacy':'privacy','nav-terms':'terms','nav-licenses':'licenses',title:'brand',intro:'intro',privacy:'policy',terms:'service',licenses:'notice',contact:'contact'}))document.getElementById(id).textContent=t[key];
    ['privacy','terms','licenses'].forEach((id,i)=>document.getElementById(id).href=t.links[i]);
    selector.value=code;
  }
  selector.addEventListener('change',()=>render(selector.value));
  render(new URLSearchParams(location.search).get('lang') || navigator.language);
})();
</script></body></html>
